name: Verify

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify Sticky
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: true
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Restore Next.js build cache
        uses: actions/cache@v6.1.0
        with:
          path: .next/cache
          key: ${{ runner.os }}-next-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-next-${{ hashFiles('package-lock.json') }}-

      - name: Install Playwright browser
        run: npx playwright install --with-deps chrome

      - name: Run verification gate
        run: npm run verify

      - name: Retain browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: workspace-browser-results
          path: test-results/
          retention-days: 7

  database:
    name: Verify authenticated persistence
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: true
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chrome
      - name: Start isolated Supabase and replay repository migrations
        run: npm run database:start
      - name: Verify API persistence, RLS, pagination, recurrence and outbox
        run: npm run test:database
      - name: Verify authenticated desktop and mobile workspace
        run: npm run test:database-browser
      - name: Retain browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: database-browser-results
          path: test-results/
          retention-days: 7
      - name: Stop isolated stack
        if: always()
        run: npx supabase stop --no-backup
